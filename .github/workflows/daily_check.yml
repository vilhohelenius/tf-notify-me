name: Daily competition check

on:
  schedule:
    # Joka aamu klo 07:00 UTC = 09:00 talvella / 10:00 kesällä (Suomen aika)
    - cron: "0 7 * * *"
  workflow_dispatch:  # Mahdollistaa manuaalisen ajamisen GitHubista

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run competition checker
        env:
          NTFY_CHANNEL: ${{ secrets.NTFY_CHANNEL }}
        run: python check_competitions.py
